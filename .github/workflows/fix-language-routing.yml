name: Fix TGPU Gulf language routing

on:
  push:
    paths:
      - '.github/workflows/fix-language-routing.yml'

permissions:
  contents: write

jobs:
  fix-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize language links and hreflang
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('index.html')
          s = root.read_text(encoding='utf-8')
          s = s.replace('href="/?lang=ms"', 'href="/ms/"')
          if 'hreflang="ms"' not in s:
              s = s.replace('<link rel="alternate" hreflang="ar" href="https://tgpugulf.com/ar/">', '<link rel="alternate" hreflang="ms" href="https://tgpugulf.com/ms/">\n<link rel="alternate" hreflang="ar" href="https://tgpugulf.com/ar/">')
          root.write_text(s, encoding='utf-8')

          ar = Path('ar/index.html')
          s = ar.read_text(encoding='utf-8')
          if 'hreflang="ms"' not in s:
              s = s.replace('<link rel="alternate" hreflang="ar" href="https://tgpugulf.com/ar/">', '<link rel="alternate" hreflang="ms" href="https://tgpugulf.com/ms/">\n<link rel="alternate" hreflang="ar" href="https://tgpugulf.com/ar/">')
          s = s.replace('<a class="lang" href="/">English</a>', '<span class="language-set" aria-label="Languages"><a class="lang" href="/">EN</a><a class="lang" href="/ms/">BM</a><a class="lang active" href="/ar/" aria-current="page">العربية</a></span>')
          ar.write_text(s, encoding='utf-8')
          PY
      - name: Commit routing fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ar/index.html
          if git diff --cached --quiet; then
            echo 'No routing changes needed.'
            exit 0
          fi
          git commit -m 'Fix Malay language routing and hreflang'
          git push origin HEAD:main
